---
- name: Test the DVLS lookup plugins
  hosts: localhost
  gather_facts: false
  vars:
    test_path: "tests\\create-secrets"
    shared_folder_path: "tests\\lookup-plugin"
  module_defaults:
    devolutions.dvls.create_secret:
      server_base_url: "{{ lookup('env', 'DVLS_SERVER_BASE_URL') }}"
      app_key: "{{ lookup('env', 'DVLS_APP_KEY') }}"
      app_secret: "{{ lookup('env', 'DVLS_APP_SECRET') }}"
      vault_id: "{{ lookup('env', 'DVLS_VAULT_ID') }}"
  tasks:
    - name: Generate the values used by this run
      ansible.builtin.set_fact:
        run_id: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=10) }}"
        lookup_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=24) }}"

    - name: Name the entry this run will create
      ansible.builtin.set_fact:
        entry_name: "ci-lookup-{{ run_id }}"

    - name: Exercise the lookup plugins
      block:
        - name: Create the credential the lookups will read
          devolutions.dvls.create_secret:
            secret:
              secret_path: "{{ test_path }}"
              secret_name: "{{ entry_name }}"
              value: "{{ lookup_password }}"
          register: created

        - name: Look the password up by name and by id
          ansible.builtin.set_fact:
            password_by_name: "{{ lookup('devolutions.dvls.secret', entry_name) }}"
            password_by_id: "{{ lookup('devolutions.dvls.secret', created.id) }}"
          no_log: true

        - name: Assert both lookup methods return the value that was written
          ansible.builtin.assert:
            that:
              - password_by_name == lookup_password
              - password_by_id == lookup_password

        - name: Look up a specific field
          ansible.builtin.set_fact:
            username_value: "{{ lookup('devolutions.dvls.secret', entry_name, field='username') }}"
          no_log: true

        - name: Assert the field lookup returned a value
          ansible.builtin.assert:
            that:
              - username_value | length > 0

        - name: Look the full credential up by name and by id
          ansible.builtin.set_fact:
            full_by_name: "{{ lookup('devolutions.dvls.secret_full', entry_name) }}"
            full_by_id: "{{ lookup('devolutions.dvls.secret_full', created.id) }}"
          no_log: true

        - name: Assert the full credential is consistent across both methods
          ansible.builtin.assert:
            that:
              - full_by_name.password == lookup_password
              - full_by_name.username == full_by_id.username

        - name: Look up the entry that is alone in the shared test folder, by path and by name
          ansible.builtin.set_fact:
            shared_by_path: "{{ lookup('devolutions.dvls.secret_full', shared_folder_path) }}"
            shared_by_name: "{{ lookup('devolutions.dvls.secret_full', 'lookup-plugin') }}"
          no_log: true

        - name: Assert the path lookup and the name lookup return the same credential
          ansible.builtin.assert:
            that:
              - shared_by_path.username == shared_by_name.username
              - shared_by_path.password == shared_by_name.password

        - name: Look up an unsupported field
          ansible.builtin.set_fact:
            invalid_field: "{{ lookup('devolutions.dvls.secret', entry_name, field='nonexistent_field') }}"
          ignore_errors: true
          register: invalid_field_result

        - name: Assert an unsupported field fails
          ansible.builtin.assert:
            that:
              - invalid_field_result is failed

        - name: Look up a credential that does not exist
          ansible.builtin.set_fact:
            missing_credential: "{{ lookup('devolutions.dvls.secret_full', 'this-credential-does-not-exist-12345') }}"
          ignore_errors: true
          register: missing_credential_result

        - name: Assert a missing credential fails
          ansible.builtin.assert:
            that:
              - missing_credential_result is failed

      always:
        - name: Log in to DVLS for the cleanup
          ansible.builtin.uri:
            url: "{{ lookup('env', 'DVLS_SERVER_BASE_URL') }}/api/v1/login"
            method: POST
            body_format: json
            body:
              appKey: "{{ lookup('env', 'DVLS_APP_KEY') }}"
              appSecret: "{{ lookup('env', 'DVLS_APP_SECRET') }}"
          register: cleanup_login
          no_log: true

        - name: Delete the entry this run created
          ansible.builtin.uri:
            url: "{{ lookup('env', 'DVLS_SERVER_BASE_URL') }}/api/v1/vault/{{ lookup('env', 'DVLS_VAULT_ID') }}/entry/{{ item }}"
            method: DELETE
            headers:
              tokenId: "{{ cleanup_login.json.tokenId }}"
            status_code: [200, 202, 204]
          no_log: true
          loop: "{{ [created.id | default('')] | select | list }}"
