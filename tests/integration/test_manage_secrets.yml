---
- name: Test the DVLS secret modules
  hosts: localhost
  gather_facts: false
  vars_files:
    - configurations.yml
  vars:
    test_path: "tests\\create-secrets"
    entry_url: "{{ lookup('env', 'DVLS_SERVER_BASE_URL') }}/api/v1/vault/{{ lookup('env', 'DVLS_VAULT_ID') }}/entry"
  module_defaults:
    devolutions.dvls.create_secret:
      server_base_url: "{{ lookup('env', 'DVLS_SERVER_BASE_URL') }}"
      app_key: "{{ lookup('env', 'DVLS_APP_KEY') }}"
      app_secret: "{{ lookup('env', 'DVLS_APP_SECRET') }}"
      vault_id: "{{ lookup('env', 'DVLS_VAULT_ID') }}"
    devolutions.dvls.fetch_secrets:
      server_base_url: "{{ lookup('env', 'DVLS_SERVER_BASE_URL') }}"
      app_key: "{{ lookup('env', 'DVLS_APP_KEY') }}"
      app_secret: "{{ lookup('env', 'DVLS_APP_SECRET') }}"
      vault_id: "{{ lookup('env', 'DVLS_VAULT_ID') }}"
  tasks:
    - name: Generate the values used by this run
      ansible.builtin.set_fact:
        run_id: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=10) }}"
        initial_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=24) }}"
        updated_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=24) }}"

    - name: Name the entries this run will create
      ansible.builtin.set_fact:
        entry_name: "ci-{{ run_id }}"
        typed_entry_name: "ci-{{ run_id }}-typed"

    - name: Exercise the secret modules
      block:
        - name: Create the secret used by the rest of the play
          devolutions.dvls.create_secret:
            secret:
              secret_path: "{{ test_path }}"
              secret_name: "{{ entry_name }}"
              value: "{{ initial_password }}"
          register: created

        - name: Assert the creation returned an entry id
          ansible.builtin.assert:
            that:
              - created.id is defined
              - created.id | length > 0

        - name: Fetch the secret by name
          devolutions.dvls.fetch_secrets:
            secrets:
              - secret_name: "{{ entry_name }}"
          register: by_name
          no_log: true

        - name: Assert the name lookup returned the value that was written
          ansible.builtin.assert:
            that:
              - entry_name in by_name
              - by_name[entry_name].password == initial_password

        - name: Fetch the secret by id
          devolutions.dvls.fetch_secrets:
            secrets:
              - secret_id: "{{ created.id }}"
          register: by_id
          no_log: true

        - name: Assert the id lookup returned the same value
          ansible.builtin.assert:
            that:
              - by_id[created.id].password == initial_password

        - name: Fetch the secrets listed in configurations.yml
          devolutions.dvls.fetch_secrets:
            secrets: "{{ configs }}"
          register: from_file
          no_log: true

        - name: Assert the secret listed in the file was returned
          ansible.builtin.assert:
            that:
              - entry_name in from_file

        - name: Fetch every secret in the test folder
          devolutions.dvls.fetch_secrets:
            secrets:
              - secret_path: "{{ test_path }}"
          register: by_path
          no_log: true

        - name: Assert the test folder contains the secret
          ansible.builtin.assert:
            that:
              - entry_name in by_path

        - name: Fetch every secret in the vault
          devolutions.dvls.fetch_secrets:
            secrets: null
          register: all_secrets
          no_log: true

        - name: Assert the whole vault listing contains the secret
          ansible.builtin.assert:
            that:
              - entry_name in all_secrets

        - name: Create a secret with an explicit type and subtype
          devolutions.dvls.create_secret:
            secret:
              secret_path: "{{ test_path }}"
              secret_type: Credential
              secret_subtype: Default
              secret_name: "{{ typed_entry_name }}"
              value: "{{ initial_password }}"
          register: typed

        - name: Assert the typed secret was created
          ansible.builtin.assert:
            that:
              - typed.id is defined
              - typed.id | length > 0

        - name: Log in to DVLS
          ansible.builtin.uri:
            url: "{{ lookup('env', 'DVLS_SERVER_BASE_URL') }}/api/v1/login"
            method: POST
            body_format: json
            body:
              appKey: "{{ lookup('env', 'DVLS_APP_KEY') }}"
              appSecret: "{{ lookup('env', 'DVLS_APP_SECRET') }}"
          register: dvls_login
          no_log: true

        - name: Tag the entry through the API
          ansible.builtin.uri:
            url: "{{ entry_url }}/{{ created.id }}"
            method: PUT
            body_format: json
            body:
              name: "{{ entry_name }}"
              type: Credential
              subType: Default
              path: "{{ test_path }}"
              description: ""
              tags:
                - ci-tag
              data:
                username: "{{ entry_name }}"
                password: "{{ initial_password }}"
            headers:
              tokenId: "{{ dvls_login.json.tokenId }}"
          register: tag_result
          failed_when: false
          no_log: true

        - name: Assert the entry was tagged
          ansible.builtin.assert:
            that:
              - tag_result.status in [200, 201, 204]
            fail_msg: "Tagging the entry returned HTTP {{ tag_result.status }}"

        - name: Update the secret with a new value
          devolutions.dvls.create_secret:
            secret:
              secret_path: "{{ test_path }}"
              secret_name: "{{ entry_name }}"
              value: "{{ updated_password }}"
          register: updated

        - name: Assert the update reused the existing entry
          ansible.builtin.assert:
            that:
              - updated.id == created.id

        - name: Fetch the secret after the update
          devolutions.dvls.fetch_secrets:
            secrets:
              - secret_name: "{{ entry_name }}"
          register: after_update
          no_log: true

        - name: Assert the new value replaced the old one
          ansible.builtin.assert:
            that:
              - after_update[entry_name].password == updated_password

        - name: Log in to DVLS
          ansible.builtin.uri:
            url: "{{ lookup('env', 'DVLS_SERVER_BASE_URL') }}/api/v1/login"
            method: POST
            body_format: json
            body:
              appKey: "{{ lookup('env', 'DVLS_APP_KEY') }}"
              appSecret: "{{ lookup('env', 'DVLS_APP_SECRET') }}"
          register: dvls_login
          no_log: true

        - name: List the entry again through the API
          ansible.builtin.uri:
            url: "{{ entry_url }}?name={{ entry_name }}"
            headers:
              tokenId: "{{ dvls_login.json.tokenId }}"
          register: entry_after
          failed_when: false
          no_log: true

        - name: Assert exactly one entry came back
          ansible.builtin.assert:
            that:
              - entry_after.status == 200
              - entry_after.json.data | length == 1
            fail_msg: "Reading the entry back returned HTTP {{ entry_after.status }}"

        - name: Assert the update kept the tags the entry already had
          ansible.builtin.assert:
            that:
              - entry_after.json.data[0].tags == ["ci-tag"]
            fail_msg: "The update did not preserve the tags"

      always:
        - name: Log in to DVLS
          ansible.builtin.uri:
            url: "{{ lookup('env', 'DVLS_SERVER_BASE_URL') }}/api/v1/login"
            method: POST
            body_format: json
            body:
              appKey: "{{ lookup('env', 'DVLS_APP_KEY') }}"
              appSecret: "{{ lookup('env', 'DVLS_APP_SECRET') }}"
          register: dvls_login
          no_log: true

        - name: Delete the entries this run created
          ansible.builtin.uri:
            url: "{{ entry_url }}/{{ item }}"
            method: DELETE
            headers:
              tokenId: "{{ dvls_login.json.tokenId }}"
            status_code: [200, 202, 204]
          no_log: true
          loop: "{{ [created.id | default(''), typed.id | default('')] | select | list }}"
