---
- name: Test the DVLS server module
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fetch the server information using the environment variables
      devolutions.dvls.fetch_server:
        timeout: 60
      register: server

    - name: Assert the server reported a version, an access URI and its vaults
      ansible.builtin.assert:
        that:
          - server.version is defined
          - server.version | length > 0
          - server.accessURI is defined
          - server.accessURI is search('^https?://')
          - server.vaults | length > 0
          - server.vaults | selectattr('id', 'equalto', lookup('env', 'DVLS_VAULT_ID')) | list | length == 1
